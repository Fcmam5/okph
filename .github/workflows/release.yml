
name: Release Node.js Package

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm'
        type: boolean
        required: true
        default: false
  release:
    types: [published]

jobs:
  build-and-verify:
    name: Build, Test & Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: '' # disable built-in caching; managed explicitly via actions/cache below

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/package.json') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test:cov
      - run: pnpm run build

      - name: Pack tarball (dry-run inspection)
        run: |
          mkdir -p /tmp/pack
          pnpm pack --pack-destination /tmp/pack
          tarball=$(ls /tmp/pack/*.tgz)
          sha256sum "$tarball" > /tmp/pack/sha256sum.txt
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ### Package contents
          \`\`\`
          $(tar -tzf "$tarball")
          \`\`\`
          ### SHA-256
          \`\`\`
          $(cat /tmp/pack/sha256sum.txt)
          \`\`\`
          EOF
          echo "=== Package contents ==="
          tar -tzf "$tarball"
          echo "=== SHA-256 ==="
          cat /tmp/pack/sha256sum.txt

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-tarball
          path: /tmp/pack/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to npm
    needs: build-and-verify
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://www.npmjs.com/package/okph
    permissions:
      contents: read
      id-token: write
    steps:
      # `.nvmrc` is needed for setup-node and `registry-url` only; we publish
      # the verified tarball produced by `build-and-verify`, not the workspace.
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
          cache: '' # no caching needed in the publish job

      - name: Download verified tarball
        uses: actions/download-artifact@v8
        with:
          name: npm-tarball
          path: /tmp/pack

      - name: Publish verified tarball to npm
        run: |
          tarball=$(ls /tmp/pack/*.tgz)
          echo "Publishing $tarball"
          pnpm publish "$tarball" --access public --provenance --no-git-checks
